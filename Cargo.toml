[package]
name = "gantry"
default-run = "gantry"
version = "0.4.8"
edition = "2024"

[dependencies]
axum = "0.8.8"
baffle-client = "2.0.0"
base64 = "0.22.1"
futures-util = "0.3.31"
libc = "0.2.177"
regorus = "0.9.1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
rmcp = { version = "0.16.0", features = ["transport-streamable-http-server", "transport-streamable-http-client-reqwest", "client"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tempfile = "3.25.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.17"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "=0.14.10", features = ["x509-parser"] }
tokio-rustls = "=0.26.5"

[profile.release]
strip = "symbols"
