name: CI

on:
  pull_request:

jobs:
  test-macos:
    name: test (macOS)
    runs-on: macos-14
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          set +e
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            summary="$(tail -n 80 "$RUNNER_TEMP/cargo-test.log" | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g')"
            echo "::error title=macOS cargo test failure::$summary"
          fi
          exit "$test_status"

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --bins
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test in Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          # Ubuntu 24.04 restricts unprivileged user namespaces. Bubblewrap
          # needs capabilities inside its nested user namespace, so disable
          # that host restriction for this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The test container must permit Bubblewrap's nested namespace and
          # proc mounts. It is disposable and used only for this CI test.
          sudo podman run --rm \
            --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            docker.io/library/rust:1-bookworm \
            sh -euc '
              apt-get update
              apt-get install --yes bubblewrap curl gcc cmake clang libclang-dev pkg-config git
              git clone --no-checkout https://github.com/dstoc/baffle.git /tmp/baffle
              git -C /tmp/baffle checkout v2.0.0
              cd /tmp/baffle
              RUSTFLAGS="--cfg baffle_integration_test" cargo build --locked --bin baffle
              cd /workspace
              GANTRY_BAFFLE_TEST_BINARY=/tmp/baffle/target/debug/baffle \
              GANTRY_REQUIRE_BUBBLEWRAP_TESTS=1 cargo test --locked
            '
